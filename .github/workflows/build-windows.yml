name: Compilar Padroniza para Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão do Padroniza, por exemplo: 1.5.0"
        required: true
        default: "1.5.0"

  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    name: Gerar aplicativo e instalador
    runs-on: windows-2022
    timeout-minutes: 40

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v6

      - name: Preparar Python no servidor do GitHub
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Compilar o Padroniza
        id: build
        shell: pwsh
        env:
          APP_VERSION: ${{ inputs.version || github.ref_name }}
        run: ./build_github.ps1

      - name: Disponibilizar o instalador
        uses: actions/upload-artifact@v7
        with:
          name: Padroniza-Instalador-v${{ steps.build.outputs.version }}
          path: ${{ steps.build.outputs.installer_path }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Disponibilizar o executável portátil
        uses: actions/upload-artifact@v7
        with:
          name: Padroniza-Portatil-v${{ steps.build.outputs.version }}
          path: ${{ steps.build.outputs.portable_path }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0