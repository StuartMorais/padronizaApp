name: Build and release Office Tools for Windows

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version should increase?
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: office-tools-release
  cancel-in-progress: false

jobs:
  build-release:
    name: Build Windows EXE and installer
    runs-on: windows-2022
    timeout-minutes: 35

    steps:
      - name: Checkout repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $tag = "${{ github.ref_name }}"
            if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
              throw "Invalid release tag: $tag. Use vMAJOR.MINOR.PATCH."
            }
            $version = $tag.Substring(1)
            "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
          else {
            python tools/resolve_release_version.py `
              --bump "${{ inputs.bump }}" `
              --github-output $env:GITHUB_OUTPUT
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Install runtime and build dependencies
        shell: pwsh
        timeout-minutes: 10
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-build.txt

      - name: Preflight checks
        shell: pwsh
        timeout-minutes: 8
        run: |
          python -m compileall -q adapters app checklist_app shell main.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import PySide6, docx, fitz, reportlab; import adapters.registry; print('Office Tools imports OK')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q dev/checklist/tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build portable EXE and installer
        id: build
        shell: pwsh
        timeout-minutes: 18
        run: .\scripts\build_github.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfficeTools-${{ steps.version.outputs.version }}-windows
          path: release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          PORTABLE_PATH: ${{ steps.build.outputs.portable_path }}
          INSTALLER_PATH: ${{ steps.build.outputs.installer_path }}
          CHECKSUM_PATH: ${{ steps.build.outputs.checksum_path }}
          TARGET_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $assets = @($env:INSTALLER_PATH, $env:PORTABLE_PATH, $env:CHECKSUM_PATH)
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Release asset not found: $asset"
            }
          }

          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --clobber
          }
          else {
            $arguments = @(
              'release', 'create', $env:RELEASE_TAG,
              $env:INSTALLER_PATH, $env:PORTABLE_PATH, $env:CHECKSUM_PATH,
              '--title', "Office Tools $env:RELEASE_TAG",
              '--generate-notes'
            )
            if ($env:EVENT_NAME -eq 'workflow_dispatch') {
              $arguments += @('--target', $env:TARGET_SHA)
            }
            else {
              $arguments += '--verify-tag'
            }
            gh @arguments
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
